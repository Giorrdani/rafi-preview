function getCookie(name) {
    const cookie = document.cookie
        .split('; ')
        .find(row => row.startsWith(name + '='));

    return cookie
        ? decodeURIComponent(cookie.substring(name.length + 1))
        : null;

async function api(path, options = {}) {
    const method = (options.method || 'GET').toUpperCase();

    const headers = {
        'Content-Type': 'application/json',
        ...options.headers
    };

    // Передаём CSRF-токен при изменении данных
    if (!['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(method)) {
        const token = getCookie('XSRF-TOKEN');

        if (token) {
            headers['X-XSRF-TOKEN'] = token;
        }
    }

    const response = await fetch('/api' + path, {
        ...options,
        method,
        headers,
        credentials: 'same-origin',
        cache: 'no-store'
    });

    const text = await response.text();
    let data = null;

    if (text.trim()) {
        try {
            data = JSON.parse(text);
        } catch (e) {
            if (!response.ok) {
                throw new Error('Ошибка сервера: HTTP ' + response.status);
            }
            throw new Error('Некорректный ответ сервера');
        }
    }

    if (!response.ok) {
        throw new Error(
            data?.message ||
            data?.detail ||
            data?.error ||
            'Ошибка запроса: HTTP ' + response.status
        );
    }

    return data;
}

function rafiDialog(title,description,defaultValue,mode='confirm'){
 return new Promise(resolve=>{
  const layer=document.createElement('div');layer.className='rafi-dialog-back';
  const input=mode==='prompt'?`<input id="rafiDialogInput" maxlength="120" value="${esc(defaultValue??'')}" aria-label="${esc(title)}">`:'';
  layer.innerHTML=`<div class="rafi-dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${description?`<p>${esc(description)}</p>`:''}${input}<div class="actions"><button type="button" class="secondary" data-dialog="cancel">Отмена</button><button type="button" class="primary" data-dialog="ok">${mode==='confirm'?'Подтвердить':'Сохранить'}</button></div></div>`;
  const done=value=>{document.removeEventListener('keydown',keyHandler);layer.remove();resolve(value)};
  const keyHandler=e=>{if(e.key==='Escape')done(mode==='prompt'?null:false);if(e.key==='Enter'&&mode==='prompt')done(layer.querySelector('input').value)};
  document.addEventListener('keydown',keyHandler);
  layer.querySelector('[data-dialog="cancel"]').onclick=()=>done(mode==='prompt'?null:false);
  layer.querySelector('[data-dialog="ok"]').onclick=()=>done(mode==='prompt'?layer.querySelector('input').value:true);
  layer.onclick=e=>{if(e.target===layer)done(mode==='prompt'?null:false)};
  document.body.append(layer);(layer.querySelector('input')||layer.querySelector('[data-dialog="ok"]')).focus();
 });
}

function zoneForm(h) {
    if (!dev()) return;

    modal(h ? 'Изменить зону' : 'Новая зона', `
        <form id="zoneform">
            <label>Название зоны</label>
            <input id="zonename" required value="${esc(h?.name || '')}" placeholder="Например, Игровая зона">

            <div class="pair">
                <div>
                    <label>Слева, %</label>
                    <input id="zonex" type="number" min="0" max="90" value="${h?.x ?? 10}" required>
                </div>
                <div>
                    <label>Сверху, %</label>
                    <input id="zoney" type="number" min="0" max="90" value="${h?.y ?? 10}" required>
                </div>
                <div>
                    <label>Ширина, %</label>
                    <input id="zonew" type="number" min="10" max="90" value="${h?.width ?? 25}" required>
                </div>
                <div>
                    <label>Высота, %</label>
                    <input id="zoneh" type="number" min="10" max="90" value="${h?.height ?? 25}" required>
                </div>
            </div>

            <div class="hint">
                Это простой редактор расположения зон, а не точный архитектурный чертёж.
            </div>


            <div class="actions">
                ${h ? '<button type="button" class="secondary" id="deletezone">Удалить зону</button>' : ''}
                <button type="button" class="secondary" id="cancel">Отмена</button>
                <button class="primary" type="submit">Сохранить</button>
            </div>
        </form>
    `);

    $('cancel').onclick = close;


    // Привязываем удаление к текущему окну редактирования зоны.
    const deleteButton = $('deletezone');
    if (h && deleteButton) {
        deleteButton.addEventListener('click', async (event) => {
            event.preventDefault();
            event.stopPropagation();
            if (!await rafiConfirm(`Удалить зону «${h.name}»?\n\nЕсли зона использовалась в банкетах, она будет архивирована.`)) return;
            deleteButton.disabled = true;
            try {
                await api(apiClub('/zones/' + h.id), {method: 'DELETE'});
                halls = await api(apiClub('/halls'));
                close();
                renderMap();
            } catch (error) {
                deleteButton.disabled = false;
                notify(error);
            }
        });
    }

    $('zoneform').onsubmit = async e => {
        e.preventDefault();

        let payload = {
            name: $('zonename').value,
            x: Number($('zonex').value),
            y: Number($('zoney').value),
            width: Number($('zonew').value),
            height: Number($('zoneh').value)
        };

        try {
            await api(apiClub(`/zones${h ? '/' + h.id : ''}`), {
                method: h ? 'PUT' : 'POST',
                body: JSON.stringify(payload)
            });

            halls = await api(apiClub('/halls'));
            close();
            renderMap();
        } catch (e) {
            notify(e);
        }
    };
}
