<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rafi — Вход</title><link rel="icon" href="/rafi-monogram.svg?v=16"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff4e0;font:15px system-ui,Arial;color:#1b1e24}.card{width:min(92vw,380px);padding:35px;background:#fff;border-radius:20px;box-shadow:0 18px 55px #1b1e2415}.brand{display:flex;align-items:center;gap:12px;font-size:29px;font-weight:800;margin-bottom:20px}.brand img{width:62px;height:67px;object-fit:contain;flex:none}.brand{gap:7px;line-height:1;letter-spacing:-.8px}label{display:block;font-size:13px;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #d8d8d8;border-radius:10px;font:inherit}button{width:100%;margin-top:23px;padding:13px;border:0;border-radius:11px;background:#f0a500;color:#1b1e24;font:inherit;font-weight:700;cursor:pointer}.note{color:#777;font-size:12px;margin-top:16px;text-align:center}
/* Brand wordmark is a single aligned image, not separate text and icon. */
.brand{justify-content:center;gap:0;margin-bottom:22px;background:transparent;border-radius:0;padding:0}.brand img{display:block;width:min(100%,220px);height:auto;object-fit:contain;flex:none;filter:none}
body{background:#f7f8fa;color:#34445c}.card{border-radius:22px;box-shadow:0 8px 36px #24384c14}input{border:0;background:#f7f8fa;box-shadow:0 3px 12px #24384c0e;border-radius:13px;min-height:44px}button{background:#f3a899;color:#34445c;border-radius:999px;min-height:44px;box-shadow:0 4px 12px #db897524}input:focus-visible,button:focus-visible{outline:2px solid #f3a899;outline-offset:3px}
body{background:#e9edf2;color:#171b23}.card{background:#f9fafc;border-radius:26px;box-shadow:0 12px 35px #182a4512}.rf-login-logo{display:flex;align-items:baseline;gap:6px;font-size:42px;font-weight:500;letter-spacing:-2px}.rf-login-logo>span{font-size:11px;font-weight:400;letter-spacing:2px;color:#626b77}input{background:#e3e8ee;color:#171b23;border-radius:999px;border:0}button{background:#171b23;color:white;border-radius:999px;font-weight:500}h2{font-weight:500;font-size:20px}input:focus-visible,button:focus-visible{outline-color:#626b77}

input{font-size:16px}html,body{touch-action:manipulation}.note{color:#626b77}</style><script>document.documentElement.dataset.theme=localStorage.getItem('kidsclub-theme')||'light';</script></head><body><main class="card"><div class="brand"><span class="rf-login-logo">Rafi<span>CLUBS</span></span></div><h2>Вход в систему</h2><p id="login-error" role="alert" style="display:none;background:#fff1ec;color:#923a24;border-radius:10px;padding:12px"></p><form method="post" action="/login"><input type="hidden" name="_csrf" id="csrf"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Войти</button></form><p class="note">Доступ только для сотрудников клуба</p></main><script>const params=new URLSearchParams(location.search);const message=document.getElementById("login-error");if(params.has("expired")){message.textContent="Сессия завершена. Войдите снова.";message.style.display="block";}else if(params.has("error")){message.textContent="Неверный логин или пароль. Проверьте данные и попробуйте снова.";message.style.display="block";}else if(params.has("locked")){message.textContent="Слишком много неудачных попыток входа. Подождите 15 минут и попробуйте снова.";message.style.display="block";}else if(params.has("logout")){message.textContent="Вы вышли из системы.";message.style.display="block";}const token=(document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/)||[])[1];if(token)document.getElementById("csrf").value=decodeURIComponent(token);</script></body></html>
